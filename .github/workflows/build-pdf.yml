name: Build PDF

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live + CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            make \
            latexmk biber \
            texlive-luatex texlive-latex-extra texlive-bibtex-extra \
            texlive-lang-cjk texlive-lang-japanese texlive-fonts-recommended \
            fonts-noto-cjk \
            unzip fontconfig

          # Source Han Serif TW is not in apt — download from Adobe's release
          curl -L -o /tmp/SourceHanSerifTW.zip \
            https://github.com/adobe-fonts/source-han-serif/releases/download/2.003R/15_SourceHanSerifTW.zip
          mkdir -p "$HOME/.local/share/fonts"
          unzip -q /tmp/SourceHanSerifTW.zip -d "$HOME/.local/share/fonts/SourceHanSerifTW"
          fc-cache -fv

          # annotate-equations.sty is not in apt — install from CTAN to ~/texmf
          TMPDIR=$(mktemp -d)
          curl -L "https://mirrors.ctan.org/macros/latex/contrib/annotate-equations.zip" -o "$TMPDIR/annotate-equations.zip"
          unzip -q "$TMPDIR/annotate-equations.zip" -d "$TMPDIR"
          mkdir -p "$HOME/texmf/tex/latex/annotate-equations"
          cp "$TMPDIR/annotate-equations/annotate-equations.sty" "$HOME/texmf/tex/latex/annotate-equations/"
          mktexlsr "$HOME/texmf"

      - name: Build PDF
        run: make

      - name: Rename PDF with commit info
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          cp main.pdf "tech-society-final-${SHORT_SHA}.pdf"
          echo "PDF_NAME=tech-society-final-${SHORT_SHA}.pdf" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-output
          path: ${{ env.PDF_NAME }}
          retention-days: 30

      - name: Clean previous release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # If the release doesn't exist yet, nothing to clean
          if ! gh release view latest-build >/dev/null 2>&1; then
            echo "No previous latest-build release; skipping cleanup"
            exit 0
          fi

          # Delete every attached asset except the auto-generated source archives
          gh release view latest-build --json assets -q '.assets[].name' \
            | while IFS= read -r name; do
                case "$name" in
                  "Source code.zip"|"Source code.tar.gz") continue ;;
                esac
                echo "Removing old asset: $name"
                gh release delete-asset latest-build "$name" --yes
              done

      - name: Create or update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-build
          name: Latest Build
          body: |
            Auto-built PDF from commit `${{ github.sha }}`

            Branch: `${{ github.ref_name }}`
            Triggered by: ${{ github.actor }}
          files: ${{ env.PDF_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}